name: dev 预发布构建

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  gate:
    name: 触发条件检查
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[build]')
    steps:
      - run: echo "开始 dev 预发布构建"

  windows:
    name: Windows x64
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - run: flutter build windows --release

      - name: 打包便携版
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Path dist\BalanceHub -Force | Out-Null
          Copy-Item -Path build\windows\x64\runner\Release\* -Destination dist\BalanceHub -Recurse
          Compress-Archive -Path dist\BalanceHub -DestinationPath "BalanceHub-windows-x64-$sha.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: BalanceHub-windows-x64-*.zip
          if-no-files-found: error

  android:
    name: Android 通用 APK
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: 构建 APK（调试签名）
        run: |
          BASE_VERSION=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          flutter build apk --release \
            --build-name="${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}" \
            --build-number="${GITHUB_RUN_NUMBER}"

      - name: 重命名产物
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp build/app/outputs/flutter-apk/app-release.apk \
            "BalanceHub-android-universal-${SHA}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          path: BalanceHub-android-universal-*.apk
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      # Flutter 官方未发布 Linux arm64 的 SDK 压缩包（releases_linux.json 无 arm64 归档），
      # arm64 改为从 git 标签引导；Dart SDK 与引擎的 arm64 产物在 flutter_infra_release 可下载。
      - name: 安装 Flutter（x64 官方包）
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 安装 Flutter（arm64 git 引导）
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: 初始化 Flutter（arm64）
        if: matrix.arch == 'arm64'
        run: |
          flutter --version
          flutter config --no-analytics

      - run: flutter pub get

      - run: flutter build linux --release

      - name: 打包
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mkdir -p dist/BalanceHub
          cp -r build/linux/${{ matrix.arch }}/release/bundle/. dist/BalanceHub/
          tar -czf "BalanceHub-linux-${{ matrix.arch }}-${SHA}.tar.gz" -C dist BalanceHub

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: BalanceHub-linux-${{ matrix.arch }}-*.tar.gz
          if-no-files-found: error

  publish:
    name: 发布 dev-build
    needs: [windows, android, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        working-directory: artifacts
        run: |
          sha256sum BalanceHub-*.zip BalanceHub-*.apk BalanceHub-*.tar.gz > SHA256SUMS.txt

      - name: 覆盖 dev-build 预发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cat > release-notes.md <<EOF
          ## BalanceHub dev-build

          - 提交：${{ github.sha }}
          - 触发方式：${{ github.event_name }}
          - Flutter：${{ env.FLUTTER_VERSION }}
          - 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')

          产物：

          - Windows x64 便携版（zip，解压后运行 balancehub.exe）
          - Android 通用 APK（release 模式，调试签名）
          - Linux x64 / arm64（tar.gz，解压后运行 BalanceHub/balancehub）

          注意：

          - dev 包为调试签名版本，仅供测试
          - Linux 运行需 libsecret-1-0 与可用 Keyring

          校验和见 SHA256SUMS.txt。
          EOF
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "dev-build ${SHA}" \
            --notes-file release-notes.md \
            artifacts/*
